name: Beritahu server ada kod baharu

# Hos merdeka.samfirefc.com ada perlindungan anti-bot yang menyekat
# panggilan HTTP dari GitHub Actions, dan firewall menutup FTP/SSH dari
# luar. Jadi kaedah sebenar ialah CRON di server:
#
#   */5 * * * * /usr/local/bin/php \
#     /home/adampowe/merdeka.samfirefc.com/api/deploy.php --cron
#
# Cron itu menyemak commit terkini setiap 5 minit dan menarik kod bila
# ada perubahan. Workflow ini hanya mencatat bahawa commit baharu wujud.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  maklum:
    runs-on: ubuntu-latest
    steps:
      - name: Catat commit baharu
        run: |
          echo "Commit baharu: ${GITHUB_SHA:0:7}"
          echo "Server akan menariknya dalam masa 5 minit melalui cron."
          echo "Untuk segera: buka /api/deploy.php?kunci=... dalam pelayar."
