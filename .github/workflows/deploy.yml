name: Deploy ke merdeka.samfirefc.com

# Firewall hos menutup FTP/SSH dari luar, jadi GitHub tidak boleh tolak fail
# ke server. Sebaliknya kita suruh server TARIK sendiri kod terkini dari
# GitHub melalui HTTPS (sambungan keluar — sentiasa dibenarkan).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Suruh server tarik kod terkini
        run: |
          echo "Memanggil endpoint deploy..."
          kod=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            "https://merdeka.samfirefc.com/api/deploy.php?kunci=${{ secrets.DEPLOY_KEY }}" \
            -o /tmp/hasil.json | tail -1)
          echo "HTTP $kod"
          cat /tmp/hasil.json
          echo
          if [ "$kod" != "200" ]; then
            echo "::error::Deploy gagal (HTTP $kod)"
            exit 1
          fi
          grep -q '"ok":true' /tmp/hasil.json || { echo "::error::Server melaporkan kegagalan"; exit 1; }
          echo "Deploy berjaya."
